name: append-only-log
# Daily: commit the exact bytes+sha256 of a published upstream evidence export
# into the signed append-only log, then publish the new head.
#
# The signing key is a repository secret (CANARI_LOG_KEY_PEM, base64 of the PEM).
# It is never committed; .gitignore excludes *.pem. If the secret is absent the
# job fails loudly instead of silently generating a throwaway key, because a
# new key would orphan every previously published head.
on:
  schedule:
    - cron: "17 4 * * *"    # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: append-only-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.CANARI_LOG_KEY_PEM }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::CANARI_LOG_KEY_PEM secret is not set. Refusing to run"
            echo "::error::because generating a new key would orphan every published head."
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > docs/log/signing_key.pem
          chmod 600 docs/log/signing_key.pem

      - name: Audit before appending
        run: python -m canari.log_cli audit docs/log --log-id canari-snapshot-log

      - name: Append today's snapshot and seal
        run: |
          env -u HTTPS_PROXY -u HTTP_PROXY -u ALL_PROXY \
            python scripts/log_daily.py --log-dir docs/log

      - name: Log our own verdict bundles
        # --out is deliberately not head-latest.json: publish_log.py is the
        # single writer of that pointer, so a later seal cannot leave it stale.
        run: python scripts/log_verdicts.py --out docs/log/verdicts-latest.json

      - name: Rebuild the published page and latest bundle
        run: python scripts/publish_log.py

      # Anchor the NEWEST IMMUTABLE head file, never head-latest.json.
      #
      # Real bug caught here (2026-11-15): the first version stamped
      # head-latest.json, which the next run rewrote (new audit block, new
      # appended list). Its bytes changed, so the OTS commitment no longer
      # matched any file on disk and every calendar returned
      # CommitmentNotFoundError -- the proof was permanently dead. A timestamp
      # is only meaningful over bytes that never change. heads/<size>-<root>.json
      # is content-addressed and write-once, so it is the only correct target.
      - name: Anchor newest immutable head (OpenTimestamps submit)
        continue-on-error: true
        run: |
          pip install --no-build-isolation opentimestamps-client
          HEAD=$(ls -1 docs/log/heads/*.json | tail -1)
          echo "anchoring $HEAD"
          env -u HTTPS_PROXY -u HTTP_PROXY -u ALL_PROXY \
            python scripts/anchor_ots.py submit "$HEAD"

      - name: Verify what we are about to publish
        run: |
          python -m canari.verify_offline docs/log/bundle-latest.json \
            --log-id canari-snapshot-log --root "$(python -c 'import json;print(json.load(open("docs/log/head-latest.json"))["head"]["body"]["root"])')"

      - name: Commit
        run: |
          git config user.name "canari-log"
          git config user.email "canari-log@users.noreply.github.com"
          git add docs/log
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "log: $(date -u +%Y-%m-%d) snapshot commitment"
            git push
          fi

      - name: Clean up key
        if: always()
        run: rm -f docs/log/signing_key.pem
