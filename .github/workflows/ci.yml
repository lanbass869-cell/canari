name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" pytest-cov hypothesis
      - run: python -m pytest tests/ -q --tb=short
      # quality gate 1: line coverage must stay >= 85%
      - run: |
          python -m pytest tests -q -p no:cacheprovider \
            --cov=canari --cov-branch --cov-fail-under=85

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-cov hypothesis
      # quality gate 2: mutation kill rate must stay >= 90%
      # (equivalent mutants are excluded; see scripts/mutations_batch2.py)
      - run: python scripts/mutation_sweep.py --min-kill 90

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --select E9,F63,F7,F82

  # The ten network tests (npm sigstore / PyPI PEP 740 native provenance) are
  # skipped by default because they hit the open internet. Nothing in this
  # workflow ever set CANARI_NETWORK_TESTS, so the real ingestion path was
  # never exercised by CI at all -- found 2026-11-19. They run here, in their
  # own job, so an upstream API change shows up as a red check instead of as
  # silently missing data (npm provenance was 52.5%, PyPI 0%, and nothing
  # could tell "upstream publishes none" from "we broke").
  network:
    runs-on: ubuntu-24.04
    continue-on-error: true   # upstream flakiness must not block a merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-cov hypothesis
      - env:
          CANARI_NETWORK_TESTS: "1"
        run: python -m pytest tests -q -m network --tb=short
