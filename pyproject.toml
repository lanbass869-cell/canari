[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canari-mcp"
version = "0.1.3"
description = "Canari - agent component verification ledger: signed, offline-verifiable attestations for MCP servers and agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Canari contributors"}]
keywords = ["mcp", "agent", "supply-chain", "attestation", "security", "in-toto", "dsse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "jsonschema>=4.0",
    "in-toto>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
canari-verify = "canari.verify_cli:main"
canari-baseline = "canari.baseline:main"
canari-gate = "canari.gate_cli:main"
canari-drift = "canari.drift_cli:main"
canari-mcp = "canari.mcp_server:main"
canari-guard = "canari.guard:main"

[project.urls]
Homepage = "https://github.com/lanbass869-cell/canari"

[tool.setuptools.packages.find]
include = ["canari*"]

[tool.setuptools.package-data]
canari = [
    "attestation-v0.1.json",
    "_snapshot/*.json",
    "_snapshot/attestations/*.bundle.json",
]

[tool.coverage.run]
source = ["canari"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]
